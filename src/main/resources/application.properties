spring.application.name=backend

# CONFIGURACIÓN DE BASE DE DATOS
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/zenless_db}
spring.datasource.username=${DB_USER:admin_zenless}
spring.datasource.password=${DB_PASSWORD:academy_password_123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT CONFIG
jwt.secret=${JWT_SECRET:ZZZAcademySecretKeyForJwtTokensThatNeedsToBeLongEnoughToBeSecure1234!!}
jwt.expirationMs=86400000

# == CORS Configuration ==
frontend.url=${FRONTEND_URL:http://localhost:4200}

# == File Upload Configuration ==
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload-dir=uploads/
